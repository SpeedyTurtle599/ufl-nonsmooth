name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ufl-nonsmooth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Match the release tag to the built version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PYTHON'
          import email
          import glob
          import os
          import zipfile

          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              metadata_path = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(wheel.read(metadata_path))
          assert os.environ["RELEASE_TAG"].removeprefix("v") == metadata["Version"]
          PYTHON
      - name: Publish checked distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
